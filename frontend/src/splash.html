<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Loading</title>
    <style>
      body {
        margin: 0;
        background: #1e1e1e;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: sans-serif;
      }

      .spinner {
        width: 120px;
        height: 120px;
        border: 8px solid rgba(255, 255, 255, 0.1);
        border-top: 8px solid #4cafef; /* colore principale app */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div class="spinner"></div>

    <script>
      (async function waitBackendAndGo() {
        await new Promise(r => setTimeout(r, 150));

        while (true) {
          try {
            const res = await fetch('http://127.0.0.1:3000/health', { cache: 'no-store' });
            if (res.ok) break;
          } catch (e) {}
          await new Promise(r => setTimeout(r, 300));
        }

        window.__BACKEND_READY__ = true;
        window.location.replace('index.html');
      })();
    </script>
  </body>
</html>
