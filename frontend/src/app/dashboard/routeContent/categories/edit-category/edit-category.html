<div>
  <h1>Modifica Categoria</h1>
    <form (submit)="submit($event)" class="update-category-form">
        <div class="form-group">
            <label>Nome Categoria</label>
            <input type="text" [value]="formModel().name" (input)="updateName($event.target.value)">
        </div>
        <div class="form-group">
            <label>Colore Categoria</label>
            <div class="color-picker">
                <div class="color" *ngFor="let color of colors" [ngStyle]="{'background-color': color}" [class.selected]="color === formModel().color" (click)="updateColor(color)"></div>
            </div>
            <input type="hidden" [value]="formModel().color" (input)="updateColor($event.target.value)">
        </div>
        <button type="submit" class="btn-submit">Salva</button>
    </form>
</div>
