<h3>Imposta Data Calendario</h3>

<div class="jump-selectors">
  <select [(ngModel)]="selectedMonthValue">
    <option *ngFor="let m of monthNames; let i = index" [ngValue]="i">
        {{ m }}
    </option>
  </select>

  <select [(ngModel)]="selectedYearValue">
    <option *ngFor="let y of years" [ngValue]="y">
        {{ y }}
    </option>
  </select>
</div>

<div class="dialog-actions">
  <button (click)="goToToday()">Torna all Data Attuale</button>
  <button (click)="onConfirm()">Imposta Data Selezionata</button>
</div>
