<div class="faq-container">
  <a class="faq-links" routerLink="/profiles" routerLinkActive="active" *ngIf="!currentUser()">
    <mat-icon>arrow_back</mat-icon>Torna ai profili
  </a>

  <section class="faq-section">
    <h2>Domande Frequenti</h2>

    <div *ngFor="let faq of allFaqs(); let i = index" class="faq-item" [class.active]="activeIndex === i">
      <button class="faq-question" (click)="toggleFaq(i)">
        <span>{{ faq.question }}</span>
        <mat-icon class="faq-toggle">expand_more</mat-icon>
      </button>

      <div class="faq-answer">
        <p>{{ faq.answer }}</p>
      </div>
    </div>
  </section>
</div>
